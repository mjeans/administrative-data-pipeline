name: Validate pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate committed fixtures
        run: python tests/validate_fixtures.py

  r-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        run: >-
          Rscript -e 'install.packages(c("dplyr", "readr", "stringr", "tibble"))'
      - name: Run pipeline assertions
        run: |
          Rscript tests/test_pipeline.R
          Rscript tests/test_schema_drift.R
