name: Validate pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate committed fixtures
        run: python tests/validate_fixtures.py

  r-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Restore versioned R environment
        run: Rscript scripts/restore_environment.R
      - name: Run pipeline assertions
        run: |
          Rscript tests/test_pipeline.R
          Rscript tests/test_schema_drift.R
      - name: Publish aggregate audit example
        run: Rscript scripts/publish_audit.R
